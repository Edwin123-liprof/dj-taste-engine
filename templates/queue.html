<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/static/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ Queue · DJ Taste Engine</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --green:#1DB954; --green-light:#1ed760; --black:#000; --dark:#121212; --card:#181818; --card2:#282828; --gray:#B3B3B3; --white:#fff; }
    body { background: var(--dark); color: var(--white); font-family: 'Inter', sans-serif; min-height: 100vh; }

    .navbar { background: #000; padding: 0 40px; height: 64px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1a1a1a; position: sticky; top: 0; z-index: 100; }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo img { width: 32px; height: 32px; border-radius: 6px; }
    .nav-logo-text { font-size: 15px; font-weight: 700; color: var(--white); }
    .nav-logo-text span { color: var(--green); }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: var(--gray); text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--white); }
    .btn-sm { background: var(--green); color: var(--black) !important; padding: 7px 18px; border-radius: 50px; font-weight: 700 !important; font-size: 13px !important; }

    .page-hero {
      padding: 60px 40px 40px;
      background: linear-gradient(180deg, rgba(29,185,84,0.08) 0%, transparent 100%);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .page-hero h1 { font-size: 40px; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; }
    .page-hero h1 span { color: var(--green); }
    .page-hero p { color: var(--gray); font-size: 15px; margin-bottom: 28px; }
    .hero-actions { display: flex; gap: 12px; align-items: center; }
    .btn-generate { background: var(--green); color: var(--black); border: none; padding: 14px 32px; border-radius: 50px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .btn-generate:hover { background: var(--green-light); transform: scale(1.03); }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .gen-status { font-size: 13px; color: var(--gray); }

    .phase-legend { display: flex; gap: 20px; padding: 20px 40px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--gray); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    .container { padding: 24px 40px; }

    .queue-table { width: 100%; border-collapse: collapse; }
    .queue-table thead tr { border-bottom: 1px solid rgba(255,255,255,0.08); }
    .queue-table th { padding: 10px 16px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gray); text-align: left; font-weight: 600; }
    .queue-table td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
    .queue-table tbody tr { transition: background 0.15s; }
    .queue-table tbody tr:hover td { background: rgba(255,255,255,0.03); }
    .queue-table tbody tr:last-child td { border-bottom: none; }

    .num { color: #444; font-weight: 700; font-size: 13px; }
    .phase-badge { display: inline-block; padding: 3px 12px; border-radius: 50px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .phase-warmup { background: rgba(29,185,84,0.12); color: #1DB954; }
    .phase-build { background: rgba(52,152,219,0.12); color: #3498db; }
    .phase-peak { background: rgba(231,76,60,0.12); color: #e74c3c; }
    .phase-cooldown { background: rgba(243,156,18,0.12); color: #f39c12; }

    .track-name { font-weight: 600; font-size: 14px; }
    .track-artist { font-size: 12px; color: var(--gray); margin-top: 2px; }
    .score { font-weight: 700; color: var(--green); }
    .play-link { color: var(--green); text-decoration: none; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; opacity: 0.7; transition: opacity 0.2s; }
    .play-link:hover { opacity: 1; }

    .empty-state { text-align: center; padding: 80px 40px; color: var(--gray); }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 15px; margin-bottom: 24px; }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="/" class="nav-logo">
    <img src="/static/logo.png" alt="Logo">
    <span class="nav-logo-text">DJ <span>Taste Engine</span></span>
  </a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/queue" class="active">DJ Queue</a>
  </div>
</nav>

<div class="page-hero">
  <h1>Your <span>DJ Queue</span></h1>
  <p>20 tracks structured like a real DJ set — built from your taste score, right now.</p>
  <div class="hero-actions">
    <button class="btn-generate" onclick="generateQueue()" id="gen-btn">▶ Generate Queue</button>
    <span class="gen-status" id="gen-status"></span>
  </div>
</div>

<div class="phase-legend">
  <div class="legend-item"><div class="legend-dot" style="background:#1DB954"></div>Warmup — easing in</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3498db"></div>Build — rising energy</div>
  <div class="legend-item"><div class="legend-dot" style="background:#e74c3c"></div>Peak — your best tracks</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f39c12"></div>Cooldown — winding down</div>
</div>

<div class="container">
  <div id="queue-wrap">
    <div class="empty-state">
      <div class="icon">🎧</div>
      <p>Hit Generate Queue to build your personalized DJ set.</p>
      <button class="btn-generate" onclick="generateQueue()">Generate Queue</button>
    </div>
  </div>
</div>

<script>
  async function generateQueue() {
    const btn = document.getElementById('gen-btn');
    const status = document.getElementById('gen-status');
    btn.disabled = true;
    status.textContent = 'Building your set...';

    const res = await fetch('/api/queue');
    const queue = await res.json();

    btn.disabled = false;
    status.textContent = `✓ ${queue.length} tracks ready`;
    setTimeout(() => status.textContent = '', 3000);

    document.getElementById('queue-wrap').innerHTML = `
      <table class="queue-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Phase</th>
            <th>Track</th>
            <th>Score</th>
            <th>Play</th>
          </tr>
        </thead>
        <tbody>
          ${queue.map((t, i) => `
  <tr>
    <td class="num">${i+1}</td>
    <td><span class="phase-badge phase-${t.phase}">${t.phase}</span></td>
    <td>
      <div style="display:flex;align-items:center;gap:12px;">
        ${t.album_image ? `<img src="${t.album_image}" style="width:40px;height:40px;border-radius:4px;object-fit:cover;flex-shrink:0;">` : ''}
        <div>
          <div class="track-name">${t.track_name}</div>
          <div class="track-artist">${t.artist}</div>
        </div>
      </div>
    </td>
    <td class="score">${t.taste_score}</td>
    <td><a class="play-link" href="https://open.spotify.com/track/${t.track_id}" target="_blank">▶ Open</a></td>
  </tr>
`).join('')}
        </tbody>
      </table>`;
  }
</script>
</body>
</html>
